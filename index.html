<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Japan Trip Flashcards</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root{
    --indigo:#1F3A5F;
    --indigo-d:#132743;
    --cream:#F6F1E4;
    --paper:#FBF8F0;
    --vermillion:#C1443D;
    --gold:#C9A870;
    --ink:#262320;
    --ink-soft:#6b6558;
    --line:#dcd3bd;
    --green:#3E6B4F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--indigo);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.05) 0, transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 14px);
    font-family:'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 12px 40px;
  }

  .app{width:100%; max-width:460px;}

  .header{
    background:var(--paper);
    border-radius:14px;
    padding:14px 16px 12px;
    margin-bottom:12px;
    border:1px solid rgba(0,0,0,0.06);
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
    position:relative;
    overflow:hidden;
  }
  .header::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:6px;
    background:repeating-linear-gradient(180deg, var(--vermillion) 0 10px, var(--gold) 10px 20px);
  }
  .eyebrow{
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--vermillion); font-weight:700; margin-left:10px;
  }
  h1{
    margin:2px 0 0 10px; font-size:22px; font-weight:900; letter-spacing:.01em;
    color:var(--indigo-d); line-height:1.15;
  }
  .sub{margin:4px 0 0 10px; font-size:12.5px; color:var(--ink-soft);}

  .rail{
    display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px;
    scrollbar-width:none; margin-bottom:8px;
  }
  .rail::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; background:rgba(255,255,255,0.08); color:var(--cream);
    border:1px solid rgba(255,255,255,0.18); border-radius:999px;
    padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
    white-space:nowrap; display:flex; align-items:center; gap:6px;
  }
  .chip .n{
    background:rgba(255,255,255,0.14); border-radius:999px; padding:1px 7px;
    font-size:10.5px; font-weight:700;
  }
  .chip.active{background:var(--vermillion); border-color:var(--vermillion); color:#fff;}
  .chip.active .n{background:rgba(255,255,255,0.25);}

  .track{
    display:flex; align-items:center; gap:3px; padding:0 6px 14px;
    flex-wrap:wrap; row-gap:5px;
  }
  .dot{
    flex:1; min-width:4px; height:5px; border-radius:3px; background:rgba(255,255,255,0.18);
  }
  .dot.done{background:var(--gold);}
  .dot.current{background:#fff;}

  .counter{
    text-align:center; color:var(--cream); font-size:12px; letter-spacing:.06em;
    margin-bottom:10px; opacity:.85;
  }
  .counter b{color:#fff;}

  .stage{
    perspective:1400px; margin:4px 0 16px; touch-action:pan-y;
  }
  .card{
    position:relative; width:100%; min-height:260px;
    transform-style:preserve-3d; transition:transform .5s cubic-bezier(.22,1,.36,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:18px; padding:26px 22px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; box-shadow:0 14px 34px rgba(0,0,0,0.32);
  }
  .front{
    background:var(--paper);
    border:1px solid rgba(0,0,0,0.06);
  }
  .front::after{
    content:"";
    position:absolute; top:14px; right:14px; width:34px; height:34px;
    border:2px solid var(--vermillion); border-radius:50%; opacity:.16;
  }
  .jp{
    font-weight:700; color:var(--indigo-d); line-height:1.32;
    font-family:'Noto Sans JP', sans-serif;
    font-size:38px;
  }
  .rom{
    margin-top:10px; font-size:14px; color:var(--ink-soft); letter-spacing:.03em;
  }
  .tapHint{
    position:absolute; bottom:14px; font-size:10.5px; color:#b7ae98;
    letter-spacing:.1em; text-transform:uppercase;
  }
  .back{
    background:var(--indigo-d);
    color:var(--cream);
    transform:rotateY(180deg);
    border:1px solid rgba(255,255,255,0.08);
  }
  .en{font-size:21px; font-weight:700; line-height:1.4;}
  .note{
    margin-top:12px; font-size:12.5px; color:var(--gold); line-height:1.5;
    border-top:1px solid rgba(255,255,255,0.14); padding-top:10px;
  }
  .stampBox{position:absolute; top:12px; right:14px;}
  .stamp{
    width:38px; height:38px; border-radius:50%;
    border:2px solid var(--vermillion); color:var(--vermillion);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:900; transform:rotate(-14deg);
    opacity:0; transition:opacity .2s, transform .2s;
  }
  .stamp.show{opacity:1; transform:rotate(-14deg) scale(1);}

  .controls{display:flex; gap:8px; margin-bottom:10px;}
  .btn{
    flex:1; border:none; border-radius:12px; padding:13px 8px;
    font-size:13px; font-weight:700; letter-spacing:.02em; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-prev{background:rgba(255,255,255,0.1); color:var(--cream);}
  .btn-know{background:var(--green); color:#fff;}
  .btn-again{background:var(--vermillion); color:#fff;}
  .btn:active{transform:scale(.96);}

  .toolbar{display:flex; gap:8px; margin-bottom:4px;}
  .tbtn{
    flex:1; background:rgba(255,255,255,0.06); color:var(--cream);
    border:1px solid rgba(255,255,255,0.15); border-radius:10px;
    padding:9px 6px; font-size:11.5px; font-weight:600; cursor:pointer;
  }
  .tbtn:active{transform:scale(.96);}

  .footer-note{
    text-align:center; color:rgba(255,255,255,0.4); font-size:10.5px;
    margin-top:18px; letter-spacing:.04em;
  }

  @media (max-width:360px){
    .en{font-size:18px;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="eyebrow">September Trip · Study Line</div>
    <h1>日本語カード</h1>
    <div class="sub" id="subLine">Massive flashcard deck — vocab &amp; key phrases for Japan</div>
  </div>

  <div class="rail" id="rail"></div>
  <div class="track" id="track"></div>
  <div class="counter" id="counter"></div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="jp" id="jpText"></div>
        <div class="rom" id="romText"></div>
        <div class="tapHint">tap card to flip</div>
      </div>
      <div class="face back">
        <div class="stampBox"><div class="stamp" id="stamp">済</div></div>
        <div class="en" id="enText"></div>
        <div class="note" id="noteText" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-prev" id="prevBtn">← Back</button>
    <button class="btn btn-again" id="againBtn">Study again</button>
    <button class="btn btn-know" id="knowBtn">Know it ✓</button>
  </div>
  <div class="toolbar">
    <button class="tbtn" id="shuffleBtn">🔀 Shuffle deck</button>
    <button class="tbtn" id="resetBtn">↺ Reset progress</button>
  </div>

  <div class="footer-note" id="footerNote">いってらっしゃい — swipe left/right on the card to move between cards</div>
</div>

/* ============ STATE ============ */
let currentDeck = 0;
let currentIndex = 0;
let known = {};

function key(d,i){ return DECKS[d].id + '-' + i; }

/* ============ RENDER ============ */
const railEl = document.getElementById('rail');
const trackEl = document.getElementById('track');
const counterEl = document.getElementById('counter');
const cardEl = document.getElementById('card');
const jpEl = document.getElementById('jpText');
const romEl = document.getElementById('romText');
const enEl = document.getElementById('enText');
const noteEl = document.getElementById('noteText');
const stampEl = document.getElementById('stamp');
const footerNote = document.getElementById('footerNote');

const totalCards = DECKS.reduce((sum,d)=>sum+d.cards.length,0);
document.getElementById('subLine').textContent =
  `Massive flashcard deck — ${totalCards} cards across ${DECKS.length} categories`;

function renderRail(){
  railEl.innerHTML = '';
  DECKS.forEach((d, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (i === currentDeck ? ' active' : '');
    const knownCount = d.cards.filter((_, ci) => known[key(i,ci)]).length;
    chip.innerHTML = `${d.emoji} ${d.name} <span class="n">${knownCount}/${d.cards.length}</span>`;
    chip.onclick = () => { currentDeck = i; currentIndex = 0; renderAll(); };
    railEl.appendChild(chip);
  });
}

function renderTrack(){
  trackEl.innerHTML = '';
  const cards = DECKS[currentDeck].cards;
  cards.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (known[key(currentDeck,i)] ? ' done' : '') + (i === currentIndex ? ' current' : '');
    trackEl.appendChild(dot);
  });
}

function fitJapaneseText(text){
  const len = text.length;
  if(len > 26) return '17px';
  if(len > 18) return '21px';
  if(len > 12) return '26px';
  if(len > 7) return '32px';
  return '38px';
}

function renderCard(){
  const c = DECKS[currentDeck].cards[currentIndex];
  cardEl.classList.remove('flipped');
  jpEl.textContent = c.jp;
  jpEl.style.fontSize = fitJapaneseText(c.jp);
  romEl.textContent = c.rom;
  enEl.textContent = c.en;
  if(c.note){ noteEl.style.display='block'; noteEl.textContent = '💡 ' + c.note; }
  else { noteEl.style.display='none'; }
  stampEl.classList.toggle('show', !!known[key(currentDeck,currentIndex)]);
  counterEl.innerHTML = `<b>${DECKS[currentDeck].emoji} ${DECKS[currentDeck].name}</b> · card ${currentIndex+1} of ${DECKS[currentDeck].cards.length}`;
}

function renderAll(){
  renderRail();
  renderTrack();
  renderCard();
}

/* ============ INTERACTIONS ============ */
cardEl.addEventListener('click', () => cardEl.classList.toggle('flipped'));

function goNext(){
  const cards = DECKS[currentDeck].cards;
  if(currentIndex < cards.length - 1){ currentIndex++; }
  else { currentIndex = 0; }
  renderTrack(); renderCard();
}
function goPrev(){
  const cards = DECKS[currentDeck].cards;
  if(currentIndex > 0){ currentIndex--; }
  else { currentIndex = cards.length - 1; }
  renderTrack(); renderCard();
}

document.getElementById('prevBtn').onclick = goPrev;
document.getElementById('knowBtn').onclick = () => {
  known[key(currentDeck,currentIndex)] = true;
  renderRail();
  goNext();
};
document.getElementById('againBtn').onclick = () => {
  known[key(currentDeck,currentIndex)] = false;
  renderRail();
  goNext();
};
document.getElementById('shuffleBtn').onclick = () => {
  const cards = DECKS[currentDeck].cards;
  for(let i = cards.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  currentIndex = 0;
  renderAll();
};
document.getElementById('resetBtn').onclick = () => {
  known = {};
  renderAll();
};

/* swipe gestures */
let touchStartX = 0;
cardEl.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
cardEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){
    if(dx < 0) goNext(); else goPrev();
  }
}, {passive:true});

renderAll();
</script>
