<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>旅の単語 — Travel Vocab Stamps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#20304f;
    --indigo-deep:#141f36;
    --washi:#f1ead9;
    --washi-2:#e8dfc9;
    --hanko:#b8452f;
    --gold:#b3902f;
    --ink:#1c1c1c;
    --line: rgba(20,31,54,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(179,144,47,0.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(184,69,47,0.08), transparent 45%),
      var(--washi);
    background-attachment:fixed;
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
  }
  .header{
    width:100%;
    max-width:460px;
    text-align:center;
    margin-bottom:14px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--indigo);
    opacity:0.65;
    font-weight:700;
  }
  h1{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:900;
    font-size:26px;
    margin:4px 0 2px;
    color:var(--indigo-deep);
  }
  .sub{
    font-size:12.5px;
    color:var(--indigo);
    opacity:0.72;
  }

  .tabs{
    width:100%;
    max-width:460px;
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:14px 2px 4px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.5);
    font-size:12.5px;
    font-weight:700;
    color:var(--indigo);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .tab.active{
    background:var(--indigo);
    color:var(--washi);
    border-color:var(--indigo);
  }

  .deck-meta{
    width:100%;
    max-width:460px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 4px 6px;
    font-size:12px;
    color:var(--indigo);
    opacity:0.75;
  }
  .stamps{
    display:flex;
    gap:4px;
  }
  .stamp-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--line);
  }
  .stamp-dot.done{background:var(--hanko);}

  .card-wrap{
    width:100%;
    max-width:460px;
    aspect-ratio: 5 / 6.4;
    max-height:420px;
    perspective:1400px;
    margin:10px 0 18px;
  }
  .card{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .55s cubic-bezier(.2,.8,.25,1);
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    cursor:pointer;
    -webkit-transform:rotateY(0deg) translateZ(0);
    transform:rotateY(0deg) translateZ(0);
  }
  .card.flipped{
    -webkit-transform: rotateY(180deg) translateZ(0);
    transform: rotateY(180deg) translateZ(0);
  }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    border-radius:18px;
    border:1px solid var(--line);
    box-shadow:0 18px 34px -18px rgba(20,31,54,0.45), 0 2px 8px rgba(20,31,54,0.08);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .face-front{
    -webkit-transform: rotateY(0deg) translateZ(0);
    transform: rotateY(0deg) translateZ(0);
    background:
      repeating-linear-gradient(135deg, rgba(20,31,54,0.025) 0 2px, transparent 2px 14px),
      linear-gradient(180deg, #fbf7ec, #f1e9d6);
  }
  .face-back{
    -webkit-transform: rotateY(180deg) translateZ(0);
    transform: rotateY(180deg) translateZ(0);
    background: linear-gradient(165deg, var(--indigo) 0%, var(--indigo-deep) 100%);
    color:var(--washi);
  }
  /* Hard fallback: guarantees the hidden face never bleeds through,
     even on browsers that mishandle backface-visibility */
  .card:not(.flipped) .face-back{ visibility:hidden; }
  .card.flipped .face-front{ visibility:hidden; }
  .ticket-notch{
    position:absolute;
    top:50%;
    width:22px;height:22px;
    background:var(--washi);
    border-radius:50%;
    transform:translateY(-50%);
  }
  .card-wrap{position:relative;}

  .cat-tag{
    align-self:flex-start;
    margin:16px 0 0 18px;
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--hanko);
    border:1px solid rgba(184,69,47,0.35);
    padding:3px 9px;
    border-radius:999px;
  }
  .face-back .cat-tag{
    color:var(--gold);
    border-color:rgba(179,144,47,0.5);
    margin-top:16px;
  }

  .kanji{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:900;
    font-size:clamp(30px, 10vw, 46px);
    text-align:center;
    padding:10px 20px;
    line-height:1.25;
    color:var(--indigo-deep);
  }
  .tap-hint{
    text-align:center;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--indigo);
    opacity:0.5;
    padding-bottom:16px;
    font-weight:700;
  }

  .back-body{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px 24px;
  }
  .romaji{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-style:normal;
    font-weight:700;
    font-size:19px;
    color:var(--gold);
    margin-bottom:10px;
    letter-spacing:0.02em;
  }
  .meaning{
    font-size:21px;
    font-weight:700;
    line-height:1.35;
  }
  .note{
    margin-top:12px;
    font-size:12px;
    opacity:0.7;
    max-width:280px;
    line-height:1.5;
  }
  .hanko-stamp{
    position:absolute;
    bottom:16px;
    right:18px;
    width:46px;height:46px;
    border-radius:8px;
    border:2px solid var(--hanko);
    color:var(--hanko);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:900;
    font-size:12px;
    opacity:0.85;
    transform:rotate(-8deg);
  }

  /* Fixed bottom bar keeps every control in thumb range, no scrolling needed */
  .bottom-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(180deg, rgba(241,234,217,0) 0%, var(--washi) 32%);
    backdrop-filter:blur(2px);
    z-index:20;
  }
  .controls{
    width:100%;
    max-width:460px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .ctrl-btn{
    border:none;
    background:var(--indigo);
    color:var(--washi);
    font-family:inherit;
    font-weight:700;
    font-size:13.5px;
    padding:14px 18px;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:transform .12s ease, opacity .12s ease;
    box-shadow:0 10px 20px -10px rgba(20,31,54,0.5);
  }
  .ctrl-btn:active{ transform:scale(0.96); }
  .ctrl-btn.ghost{
    background:rgba(255,255,255,0.75);
    color:var(--indigo);
    border:1px solid var(--line);
    padding:14px 16px;
    box-shadow:none;
  }
  .ctrl-btn.arrow{
    font-size:18px;
    padding:14px 20px;
    flex:0 0 auto;
  }
  .ctrl-btn.wide{ flex:1; justify-content:center; }
  .icon{ font-size:15px; line-height:1; }

  .bottom-row{
    width:100%;
    max-width:460px;
    display:flex;
    gap:8px;
  }
  .bottom-row .ctrl-btn{ padding:10px 14px; font-size:12.5px; }

  /* keep page content clear of the fixed bar */
  .spacer{ height:120px; width:100%; }

  footer{
    margin-top:26px;
    font-size:11px;
    color:var(--indigo);
    opacity:0.45;
    text-align:center;
    letter-spacing:0.04em;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }
</style>
</head>
<body>

  <div class="header">
    <div class="eyebrow">Japan Trip · Study Deck</div>
    <h1>旅の単語 — Travel Vocab</h1>
    <div class="sub">Tap a card to flip · swipe through each stop of the trip</div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="deck-meta">
    <span id="deckLabel">Card 1 of 1</span>
    <div class="stamps" id="stamps"></div>
  </div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="face face-front">
        <span class="cat-tag" id="catTagFront">—</span>
        <div class="kanji" id="kanjiText">—</div>
        <div class="tap-hint">Tap to reveal</div>
      </div>
      <div class="face face-back">
        <span class="cat-tag" id="catTagBack">—</span>
        <div class="back-body">
          <div class="romaji" id="romajiText">—</div>
          <div class="meaning" id="meaningText">—</div>
          <div class="note" id="noteText"></div>
        </div>
        <div class="hanko-stamp">既習</div>
      </div>
    </div>
  </div>

  <div class="spacer"></div>

  <footer id="footerCount">Pulled from your Japan guide, plus everyday conversation vocab</footer>

  <div class="bottom-bar">
    <div class="controls">
      <button class="ctrl-btn ghost arrow" id="prevBtn" aria-label="Previous card">◀</button>
      <button class="ctrl-btn wide" id="flipBtn"><span class="icon">⟲</span> Flip</button>
      <button class="ctrl-btn ghost arrow" id="nextBtn" aria-label="Next card">▶</button>
    </div>
    <div class="bottom-row">
      <button class="ctrl-btn ghost wide" id="shuffleBtn"><span class="icon">🔀</span> Shuffle</button>
      <button class="ctrl-btn ghost wide" id="restartBtn"><span class="icon">↺</span> Restart deck</button>
    </div>
  </div>

<script>
const DATA = [
  {cat:'Essentials', jp:'すみません', rom:'sumimasen', en:'Excuse me / Sorry', note:'The most versatile word in Japanese — use it to get attention, apologize, or say thanks.'},
  {cat:'Essentials', jp:'おねがいします', rom:'onegaishimasu', en:"Please / I'd like this", note:'Attach to almost any request.'},
  {cat:'Essentials', jp:'だいじょうぶです', rom:'daijōbu desu', en:"It's okay / No thanks", note:'A soft, polite way to decline something.'},
  {cat:'Essentials', jp:'はい', rom:'hai', en:'Yes'},
  {cat:'Essentials', jp:'いいえ', rom:'iie', en:'No'},

  {cat:'Restaurant', jp:'レジ', rom:'reji', en:'Register / cashier counter'},
  {cat:'Restaurant', jp:'レシート', rom:'reshīto', en:'Receipt'},
  {cat:'Restaurant', jp:'たまご', rom:'tamago', en:'Egg', note:'Useful for “I have an egg allergy” — swap in any allergen.'},
  {cat:'Restaurant', jp:'アレルギー', rom:'arerugī', en:'Allergy'},
  {cat:'Restaurant', jp:'ベジタリアン', rom:'bejitarian', en:'Vegetarian'},
  {cat:'Restaurant', jp:'おすすめ', rom:'osusume', en:'Recommendation', note:'“What do you recommend?” — osusume wa nan desuka?'},
  {cat:'Restaurant', jp:'ごちそうさまでした', rom:'gochisōsama deshita', en:'Thank you for the meal', note:'Say it on your way out after eating.'},

  {cat:'Convenience Store', jp:'ふくろ', rom:'fukuro', en:'Bag'},
  {cat:'Convenience Store', jp:'あたためる', rom:'atatameru', en:'To warm up (food)', note:'Staff will ask “atatamemasuka?” — would you like it warmed?'},
  {cat:'Convenience Store', jp:'20歳以上', rom:'nijussai ijō', en:'20 years or older', note:'Age check for alcohol/tobacco — just tap はい on the screen.'},

  {cat:'Cafe', jp:'ホット', rom:'hotto', en:'Hot'},
  {cat:'Cafe', jp:'アイス', rom:'aisu', en:'Iced / cold'},
  {cat:'Cafe', jp:'さとう', rom:'satō', en:'Sugar'},
  {cat:'Cafe', jp:'ぎゅうにゅう', rom:'gyūnyū', en:'Regular (cow) milk'},
  {cat:'Cafe', jp:'小', rom:'shō', en:'Small (size)'},
  {cat:'Cafe', jp:'中', rom:'chū', en:'Medium (size)'},
  {cat:'Cafe', jp:'大', rom:'dai', en:'Large (size)'},
  {cat:'Cafe', jp:'もちかえり', rom:'mochikaeri', en:'Takeout / to go'},
  {cat:'Cafe', jp:'てんない', rom:'tennai', en:'For here / dine in'},
  {cat:'Cafe', jp:'くろわっさん', rom:'kurowassan', en:'Croissant'},
  {cat:'Cafe', jp:'オーツミルク', rom:'ōtsu miruku', en:'Oat milk'},
  {cat:'Cafe', jp:'アーモンドミルク', rom:'āmondo miruku', en:'Almond milk'},
  {cat:'Cafe', jp:'とうにゅう', rom:'tōnyū', en:'Soy milk'},

  {cat:'Hotel & Ryokan', jp:'りょかん', rom:'ryokan', en:'Traditional Japanese inn'},
  {cat:'Hotel & Ryokan', jp:'たたみ', rom:'tatami', en:'Tatami mat flooring'},
  {cat:'Hotel & Ryokan', jp:'ふとん', rom:'futon', en:'Futon bed (on the floor)'},
  {cat:'Hotel & Ryokan', jp:'ゆかた', rom:'yukata', en:'Light kimono worn at the inn'},
  {cat:'Hotel & Ryokan', jp:'おんせん', rom:'onsen', en:'Hot spring bath'},
  {cat:'Hotel & Ryokan', jp:'おもてなし', rom:'omotenashi', en:'Warm, attentive hospitality'},
  {cat:'Hotel & Ryokan', jp:'チェックイン', rom:'chekku in', en:'Check-in'},
  {cat:'Hotel & Ryokan', jp:'チェックアウト', rom:'chekku auto', en:'Check-out'},
  {cat:'Hotel & Ryokan', jp:'にもつ', rom:'nimotsu', en:'Luggage / baggage'},
  {cat:'Hotel & Ryokan', jp:'ちょうしょく', rom:'chōshoku', en:'Breakfast'},
  {cat:'Hotel & Ryokan', jp:'ゆうしょく', rom:'yūshoku', en:'Dinner'},
  {cat:'Hotel & Ryokan', jp:'フロント', rom:'furonto', en:'Front desk'},

  {cat:'Transportation', jp:'でんしゃ', rom:'densha', en:'Train'},
  {cat:'Transportation', jp:'ちかてつ', rom:'chikatetsu', en:'Subway'},
  {cat:'Transportation', jp:'しんかんせん', rom:'shinkansen', en:'Bullet train'},
  {cat:'Transportation', jp:'バス', rom:'basu', en:'Bus'},
  {cat:'Transportation', jp:'ひこうき', rom:'hikōki', en:'Airplane'},
  {cat:'Transportation', jp:'タクシー', rom:'takushī', en:'Taxi'},
  {cat:'Transportation', jp:'えき', rom:'eki', en:'Train station'},
  {cat:'Transportation', jp:'バスてい', rom:'basu tei', en:'Bus stop'},
  {cat:'Transportation', jp:'くうこう', rom:'kūkō', en:'Airport'},
  {cat:'Transportation', jp:'きっぷ', rom:'kippu', en:'Ticket'},
  {cat:'Transportation', jp:'かいさつ', rom:'kaisatsu', en:'Ticket gate / turnstile'},
  {cat:'Transportation', jp:'ICカード', rom:'IC kādo', en:'IC transit card', note:'Suica, Pasmo, etc. — tap to pay for trains, buses, and even konbini.'},
  {cat:'Transportation', jp:'コインロッカー', rom:'koin rokkā', en:'Coin locker', note:'For stashing luggage at stations.'},
  {cat:'Transportation', jp:'出口', rom:'deguchi', en:'Exit'},
  {cat:'Transportation', jp:'入口', rom:'iriguchi', en:'Entrance'},

  {cat:'Greetings', jp:'おはようございます', rom:'ohayō gozaimasu', en:'Good morning'},
  {cat:'Greetings', jp:'こんにちは', rom:'konnichiwa', en:'Hello / Good afternoon'},
  {cat:'Greetings', jp:'こんばんは', rom:'konbanwa', en:'Good evening'},
  {cat:'Greetings', jp:'おやすみなさい', rom:'oyasumi nasai', en:'Good night'},
  {cat:'Greetings', jp:'ありがとうございます', rom:'arigatō gozaimasu', en:'Thank you'},
  {cat:'Greetings', jp:'はじめまして', rom:'hajimemashite', en:'Nice to meet you', note:'Said only the first time you meet someone.'},
  {cat:'Greetings', jp:'よろしくおねがいします', rom:'yoroshiku onegaishimasu', en:'Pleased to meet you / please treat me well', note:'Follows hajimemashite when introducing yourself.'},
  {cat:'Greetings', jp:'さようなら', rom:'sayōnara', en:'Goodbye', note:'A bit formal — じゃあね or またね are more casual with friends.'},

  {cat:'Small Talk', jp:'げんきですか', rom:'genki desu ka', en:'How are you?'},
  {cat:'Small Talk', jp:'げんきです', rom:'genki desu', en:"I'm good / fine"},
  {cat:'Small Talk', jp:'わかりません', rom:'wakarimasen', en:"I don't understand"},
  {cat:'Small Talk', jp:'わかりました', rom:'wakarimashita', en:'Got it / understood'},
  {cat:'Small Talk', jp:'えいごをはなせますか', rom:'eigo o hanasemasu ka', en:'Do you speak English?'},
  {cat:'Small Talk', jp:'もういちどおねがいします', rom:'mō ichido onegaishimasu', en:'One more time, please', note:'Great for asking someone to repeat themselves.'},
  {cat:'Small Talk', jp:'ゆっくりおねがいします', rom:'yukkuri onegaishimasu', en:'Slowly, please'},
  {cat:'Small Talk', jp:'にほんごがすこしはなせます', rom:'nihongo ga sukoshi hanasemasu', en:'I speak a little Japanese'},

  {cat:'Numbers', jp:'いち', rom:'ichi', en:'One (1)'},
  {cat:'Numbers', jp:'に', rom:'ni', en:'Two (2)'},
  {cat:'Numbers', jp:'さん', rom:'san', en:'Three (3)'},
  {cat:'Numbers', jp:'よん', rom:'yon', en:'Four (4)'},
  {cat:'Numbers', jp:'ご', rom:'go', en:'Five (5)'},
  {cat:'Numbers', jp:'ろく', rom:'roku', en:'Six (6)'},
  {cat:'Numbers', jp:'なな', rom:'nana', en:'Seven (7)'},
  {cat:'Numbers', jp:'はち', rom:'hachi', en:'Eight (8)'},
  {cat:'Numbers', jp:'きゅう', rom:'kyū', en:'Nine (9)'},
  {cat:'Numbers', jp:'じゅう', rom:'jū', en:'Ten (10)'},
  {cat:'Numbers', jp:'ひゃく', rom:'hyaku', en:'Hundred (100)'},

  {cat:'Directions', jp:'みぎ', rom:'migi', en:'Right'},
  {cat:'Directions', jp:'ひだり', rom:'hidari', en:'Left'},
  {cat:'Directions', jp:'まっすぐ', rom:'massugu', en:'Straight ahead'},
  {cat:'Directions', jp:'ここ', rom:'koko', en:'Here'},
  {cat:'Directions', jp:'そこ', rom:'soko', en:'There'},
  {cat:'Directions', jp:'どこですか', rom:'doko desu ka', en:'Where is it?'},
  {cat:'Directions', jp:'ちかい', rom:'chikai', en:'Close / nearby'},
  {cat:'Directions', jp:'とおい', rom:'tōi', en:'Far'},

  {cat:'Shopping', jp:'いくらですか', rom:'ikura desu ka', en:'How much is it?'},
  {cat:'Shopping', jp:'たかい', rom:'takai', en:'Expensive'},
  {cat:'Shopping', jp:'やすい', rom:'yasui', en:'Cheap'},
  {cat:'Shopping', jp:'これ', rom:'kore', en:'This (thing near me)'},
  {cat:'Shopping', jp:'それ', rom:'sore', en:'That (thing near you)'},
  {cat:'Shopping', jp:'げんきん', rom:'genkin', en:'Cash'},
  {cat:'Shopping', jp:'カード', rom:'kādo', en:'Card (credit/debit)'},
  {cat:'Shopping', jp:'めんぜい', rom:'menzei', en:'Tax-free', note:'Look for this sign — many shops offer tax-free for tourists over a minimum spend.'},

  {cat:'Emergency', jp:'たすけて', rom:'tasukete', en:'Help!'},
  {cat:'Emergency', jp:'びょういん', rom:'byōin', en:'Hospital'},
  {cat:'Emergency', jp:'けいさつ', rom:'keisatsu', en:'Police'},
  {cat:'Emergency', jp:'きゅうきゅうしゃ', rom:'kyūkyūsha', en:'Ambulance'},
  {cat:'Emergency', jp:'だいじょうぶですか', rom:'daijōbu desu ka', en:'Are you okay?'},
  {cat:'Emergency', jp:'ねつがあります', rom:'netsu ga arimasu', en:'I have a fever'},
  {cat:'Emergency', jp:'おなかがいたいです', rom:'onaka ga itai desu', en:'My stomach hurts'},
];

const CATS = ['All', ...Array.from(new Set(DATA.map(d=>d.cat)))];
let currentCat = 'All';
let deck = [...DATA];
let idx = 0;
let flipped = false;

const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('card');
const kanjiEl = document.getElementById('kanjiText');
const romajiEl = document.getElementById('romajiText');
const meaningEl = document.getElementById('meaningText');
const noteEl = document.getElementById('noteText');
const catTagFront = document.getElementById('catTagFront');
const catTagBack = document.getElementById('catTagBack');
const deckLabel = document.getElementById('deckLabel');
const stampsEl = document.getElementById('stamps');

function buildTabs(){
  tabsEl.innerHTML = '';
  CATS.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'tab' + (c===currentCat ? ' active' : '');
    b.textContent = c;
    b.onclick = () => { currentCat = c; applyFilter(); };
    tabsEl.appendChild(b);
  });
}

function applyFilter(){
  deck = currentCat === 'All' ? [...DATA] : DATA.filter(d=>d.cat===currentCat);
  idx = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  buildTabs();
  buildStamps();
  render();
}

function buildStamps(){
  stampsEl.innerHTML = '';
  deck.forEach((_,i)=>{
    const dot = document.createElement('div');
    dot.className = 'stamp-dot' + (i < idx ? ' done' : '');
    stampsEl.appendChild(dot);
  });
}

function render(){
  const item = deck[idx];
  kanjiEl.textContent = item.jp;
  romajiEl.textContent = item.rom;
  meaningEl.textContent = item.en;
  noteEl.textContent = item.note || '';
  catTagFront.textContent = item.cat;
  catTagBack.textContent = item.cat;
  deckLabel.textContent = `Card ${idx+1} of ${deck.length}`;
  buildStamps();
}

function flip(){
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
}

function next(){
  flipped = false;
  cardEl.classList.remove('flipped');
  idx = (idx+1) % deck.length;
  render();
}
function prev(){
  flipped = false;
  cardEl.classList.remove('flipped');
  idx = (idx-1+deck.length) % deck.length;
  render();
}
function shuffle(){
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]] = [deck[j],deck[i]];
  }
  idx = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
}
function restart(){
  idx = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
}

cardEl.addEventListener('click', flip);
document.getElementById('flipBtn').addEventListener('click', (e)=>{ e.stopPropagation(); flip(); });
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('shuffleBtn').addEventListener('click', shuffle);
document.getElementById('restartBtn').addEventListener('click', restart);

document.getElementById('footerCount').textContent =
  `${DATA.length} words · trip vocab + everyday conversation`;

buildTabs();
applyFilter();
</script>
</body>
</html>
