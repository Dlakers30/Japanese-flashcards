<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>かな — Kana Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#20304f;
    --indigo-deep:#141f36;
    --washi:#f1ead9;
    --washi-2:#e8dfc9;
    --hanko:#b8452f;
    --gold:#b3902f;
    --ink:#1c1c1c;
    --line: rgba(20,31,54,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(179,144,47,0.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(184,69,47,0.08), transparent 45%),
      var(--washi);
    background-attachment:fixed;
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
  }
  .header{
    width:100%;
    max-width:460px;
    text-align:center;
    margin-bottom:14px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--indigo);
    opacity:0.65;
    font-weight:700;
  }
  h1{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:900;
    font-size:26px;
    margin:4px 0 2px;
    color:var(--indigo-deep);
  }
  .sub{
    font-size:12.5px;
    color:var(--indigo);
    opacity:0.72;
  }

  .tabs{
    width:100%;
    max-width:460px;
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:14px 2px 4px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.5);
    font-size:12.5px;
    font-weight:700;
    color:var(--indigo);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .tab.active{
    background:var(--indigo);
    color:var(--washi);
    border-color:var(--indigo);
  }

  .deck-meta{
    width:100%;
    max-width:460px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 4px 6px;
    font-size:12px;
    color:var(--indigo);
    opacity:0.75;
  }
  .stamps{
    display:flex;
    gap:4px;
  }
  .stamp-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--line);
  }
  .stamp-dot.done{background:var(--hanko);}

  .card-wrap{
    width:100%;
    max-width:460px;
    aspect-ratio: 5 / 6.4;
    max-height:420px;
    perspective:1400px;
    margin:10px 0 18px;
  }
  .card{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .55s cubic-bezier(.2,.8,.25,1);
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    cursor:pointer;
    -webkit-transform:rotateY(0deg) translateZ(0);
    transform:rotateY(0deg) translateZ(0);
  }
  .card.flipped{
    -webkit-transform: rotateY(180deg) translateZ(0);
    transform: rotateY(180deg) translateZ(0);
  }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    border-radius:18px;
    border:1px solid var(--line);
    box-shadow:0 18px 34px -18px rgba(20,31,54,0.45), 0 2px 8px rgba(20,31,54,0.08);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .face-front{
    -webkit-transform: rotateY(0deg) translateZ(0);
    transform: rotateY(0deg) translateZ(0);
    background:
      repeating-linear-gradient(135deg, rgba(20,31,54,0.025) 0 2px, transparent 2px 14px),
      linear-gradient(180deg, #fbf7ec, #f1e9d6);
  }
  .face-back{
    -webkit-transform: rotateY(180deg) translateZ(0);
    transform: rotateY(180deg) translateZ(0);
    background: linear-gradient(165deg, var(--indigo) 0%, var(--indigo-deep) 100%);
    color:var(--washi);
  }
  /* Hard fallback: guarantees the hidden face never bleeds through,
     even on browsers that mishandle backface-visibility */
  .card:not(.flipped) .face-back{ visibility:hidden; }
  .card.flipped .face-front{ visibility:hidden; }
  .ticket-notch{
    position:absolute;
    top:50%;
    width:22px;height:22px;
    background:var(--washi);
    border-radius:50%;
    transform:translateY(-50%);
  }
  .card-wrap{position:relative;}

  .cat-tag{
    align-self:flex-start;
    margin:16px 0 0 18px;
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--hanko);
    border:1px solid rgba(184,69,47,0.35);
    padding:3px 9px;
    border-radius:999px;
  }
  .face-back .cat-tag{
    color:var(--gold);
    border-color:rgba(179,144,47,0.5);
    margin-top:16px;
  }

  .kanji{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:900;
    font-size:clamp(48px, 22vw, 108px);
    text-align:center;
    padding:10px 20px;
    line-height:1.1;
    color:var(--indigo-deep);
  }
  .tap-hint{
    text-align:center;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--indigo);
    opacity:0.5;
    padding-bottom:16px;
    font-weight:700;
  }

  .back-body{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px 24px;
  }
  .romaji{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-style:normal;
    font-weight:700;
    font-size:19px;
    color:var(--gold);
    margin-bottom:10px;
    letter-spacing:0.02em;
  }
  .meaning{
    font-size:21px;
    font-weight:700;
    line-height:1.35;
  }
  .note{
    margin-top:12px;
    font-size:12px;
    opacity:0.7;
    max-width:280px;
    line-height:1.5;
  }
  .hanko-stamp{
    position:absolute;
    bottom:16px;
    right:18px;
    width:46px;height:46px;
    border-radius:8px;
    border:2px solid var(--hanko);
    color:var(--hanko);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:900;
    font-size:12px;
    opacity:0.85;
    transform:rotate(-8deg);
  }

  /* Fixed bottom bar keeps every control in thumb range, no scrolling needed */
  .bottom-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(180deg, rgba(241,234,217,0) 0%, var(--washi) 32%);
    backdrop-filter:blur(2px);
    z-index:20;
  }
  .controls{
    width:100%;
    max-width:460px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .ctrl-btn{
    border:none;
    background:var(--indigo);
    color:var(--washi);
    font-family:inherit;
    font-weight:700;
    font-size:13.5px;
    padding:14px 18px;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:transform .12s ease, opacity .12s ease;
    box-shadow:0 10px 20px -10px rgba(20,31,54,0.5);
  }
  .ctrl-btn:active{ transform:scale(0.96); }
  .ctrl-btn.ghost{
    background:rgba(255,255,255,0.75);
    color:var(--indigo);
    border:1px solid var(--line);
    padding:14px 16px;
    box-shadow:none;
  }
  .ctrl-btn.arrow{
    font-size:18px;
    padding:14px 20px;
    flex:0 0 auto;
  }
  .ctrl-btn.wide{ flex:1; justify-content:center; }
  .icon{ font-size:15px; line-height:1; }

  .bottom-row{
    width:100%;
    max-width:460px;
    display:flex;
    gap:8px;
  }
  .bottom-row .ctrl-btn{ padding:10px 14px; font-size:12.5px; }

  /* keep page content clear of the fixed bar */
  .spacer{ height:120px; width:100%; }

  footer{
    margin-top:26px;
    font-size:11px;
    color:var(--indigo);
    opacity:0.45;
    text-align:center;
    letter-spacing:0.04em;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }
</style>
</head>
<body>

  <div class="header">
    <div class="eyebrow">Japan Trip · Character Drills</div>
    <h1>かな — Kana Practice</h1>
    <div class="sub">Tap a card to flip · read the character, check the sound</div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="deck-meta">
    <span id="deckLabel">Card 1 of 1</span>
    <div class="stamps" id="stamps"></div>
  </div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="face face-front">
        <span class="cat-tag" id="catTagFront">—</span>
        <div class="kanji" id="kanjiText">—</div>
        <div class="tap-hint">Tap to reveal</div>
      </div>
      <div class="face face-back">
        <span class="cat-tag" id="catTagBack">—</span>
        <div class="back-body">
          <div class="romaji" id="romajiText">—</div>
          <div class="meaning" id="meaningText">—</div>
          <div class="note" id="noteText"></div>
        </div>
        <div class="hanko-stamp">既習</div>
      </div>
    </div>
  </div>

  <div class="spacer"></div>

  <footer id="footerCount">Pulled from your Japan guide, plus everyday conversation vocab</footer>

  <div class="bottom-bar">
    <div class="controls">
      <button class="ctrl-btn ghost arrow" id="prevBtn" aria-label="Previous card">◀</button>
      <button class="ctrl-btn wide" id="flipBtn"><span class="icon">⟲</span> Flip</button>
      <button class="ctrl-btn ghost arrow" id="nextBtn" aria-label="Next card">▶</button>
    </div>
    <div class="bottom-row">
      <button class="ctrl-btn ghost wide" id="shuffleBtn"><span class="icon">🔀</span> Shuffle</button>
      <button class="ctrl-btn ghost wide" id="restartBtn"><span class="icon">↺</span> Restart deck</button>
    </div>
  </div>

<script>
const DATA = [
  {cat:'Hiragana', jp:'あ', rom:'a', en:'Sound: "a"'},
  {cat:'Hiragana', jp:'い', rom:'i', en:'Sound: "i"'},
  {cat:'Hiragana', jp:'う', rom:'u', en:'Sound: "u"'},
  {cat:'Hiragana', jp:'え', rom:'e', en:'Sound: "e"'},
  {cat:'Hiragana', jp:'お', rom:'o', en:'Sound: "o"'},
  {cat:'Hiragana', jp:'か', rom:'ka', en:'Sound: "ka"'},
  {cat:'Hiragana', jp:'き', rom:'ki', en:'Sound: "ki"'},
  {cat:'Hiragana', jp:'く', rom:'ku', en:'Sound: "ku"'},
  {cat:'Hiragana', jp:'け', rom:'ke', en:'Sound: "ke"'},
  {cat:'Hiragana', jp:'こ', rom:'ko', en:'Sound: "ko"'},
  {cat:'Hiragana', jp:'さ', rom:'sa', en:'Sound: "sa"'},
  {cat:'Hiragana', jp:'し', rom:'shi', en:'Sound: "shi"'},
  {cat:'Hiragana', jp:'す', rom:'su', en:'Sound: "su"'},
  {cat:'Hiragana', jp:'せ', rom:'se', en:'Sound: "se"'},
  {cat:'Hiragana', jp:'そ', rom:'so', en:'Sound: "so"'},
  {cat:'Hiragana', jp:'た', rom:'ta', en:'Sound: "ta"'},
  {cat:'Hiragana', jp:'ち', rom:'chi', en:'Sound: "chi"'},
  {cat:'Hiragana', jp:'つ', rom:'tsu', en:'Sound: "tsu"'},
  {cat:'Hiragana', jp:'て', rom:'te', en:'Sound: "te"'},
  {cat:'Hiragana', jp:'と', rom:'to', en:'Sound: "to"'},
  {cat:'Hiragana', jp:'な', rom:'na', en:'Sound: "na"'},
  {cat:'Hiragana', jp:'に', rom:'ni', en:'Sound: "ni"'},
  {cat:'Hiragana', jp:'ぬ', rom:'nu', en:'Sound: "nu"'},
  {cat:'Hiragana', jp:'ね', rom:'ne', en:'Sound: "ne"'},
  {cat:'Hiragana', jp:'の', rom:'no', en:'Sound: "no"'},
  {cat:'Hiragana', jp:'は', rom:'ha', en:'Sound: "ha"'},
  {cat:'Hiragana', jp:'ひ', rom:'hi', en:'Sound: "hi"'},
  {cat:'Hiragana', jp:'ふ', rom:'fu', en:'Sound: "fu"'},
  {cat:'Hiragana', jp:'へ', rom:'he', en:'Sound: "he"'},
  {cat:'Hiragana', jp:'ほ', rom:'ho', en:'Sound: "ho"'},
  {cat:'Hiragana', jp:'ま', rom:'ma', en:'Sound: "ma"'},
  {cat:'Hiragana', jp:'み', rom:'mi', en:'Sound: "mi"'},
  {cat:'Hiragana', jp:'む', rom:'mu', en:'Sound: "mu"'},
  {cat:'Hiragana', jp:'め', rom:'me', en:'Sound: "me"'},
  {cat:'Hiragana', jp:'も', rom:'mo', en:'Sound: "mo"'},
  {cat:'Hiragana', jp:'や', rom:'ya', en:'Sound: "ya"'},
  {cat:'Hiragana', jp:'ゆ', rom:'yu', en:'Sound: "yu"'},
  {cat:'Hiragana', jp:'よ', rom:'yo', en:'Sound: "yo"'},
  {cat:'Hiragana', jp:'ら', rom:'ra', en:'Sound: "ra"'},
  {cat:'Hiragana', jp:'り', rom:'ri', en:'Sound: "ri"'},
  {cat:'Hiragana', jp:'る', rom:'ru', en:'Sound: "ru"'},
  {cat:'Hiragana', jp:'れ', rom:'re', en:'Sound: "re"'},
  {cat:'Hiragana', jp:'ろ', rom:'ro', en:'Sound: "ro"'},
  {cat:'Hiragana', jp:'わ', rom:'wa', en:'Sound: "wa"'},
  {cat:'Hiragana', jp:'ん', rom:'n', en:'Sound: "n"'},
  {cat:'Katakana', jp:'ア', rom:'a', en:'Sound: "a"'},
  {cat:'Katakana', jp:'イ', rom:'i', en:'Sound: "i"'},
  {cat:'Katakana', jp:'ウ', rom:'u', en:'Sound: "u"'},
  {cat:'Katakana', jp:'エ', rom:'e', en:'Sound: "e"'},
  {cat:'Katakana', jp:'オ', rom:'o', en:'Sound: "o"'},
  {cat:'Katakana', jp:'カ', rom:'ka', en:'Sound: "ka"'},
  {cat:'Katakana', jp:'キ', rom:'ki', en:'Sound: "ki"'},
  {cat:'Katakana', jp:'ク', rom:'ku', en:'Sound: "ku"'},
  {cat:'Katakana', jp:'ケ', rom:'ke', en:'Sound: "ke"'},
  {cat:'Katakana', jp:'コ', rom:'ko', en:'Sound: "ko"'},
  {cat:'Katakana', jp:'サ', rom:'sa', en:'Sound: "sa"'},
  {cat:'Katakana', jp:'シ', rom:'shi', en:'Sound: "shi"'},
  {cat:'Katakana', jp:'ス', rom:'su', en:'Sound: "su"'},
  {cat:'Katakana', jp:'セ', rom:'se', en:'Sound: "se"'},
  {cat:'Katakana', jp:'ソ', rom:'so', en:'Sound: "so"'},
  {cat:'Katakana', jp:'タ', rom:'ta', en:'Sound: "ta"'},
  {cat:'Katakana', jp:'チ', rom:'chi', en:'Sound: "chi"'},
  {cat:'Katakana', jp:'ツ', rom:'tsu', en:'Sound: "tsu"'},
  {cat:'Katakana', jp:'テ', rom:'te', en:'Sound: "te"'},
  {cat:'Katakana', jp:'ト', rom:'to', en:'Sound: "to"'},
  {cat:'Katakana', jp:'ナ', rom:'na', en:'Sound: "na"'},
  {cat:'Katakana', jp:'ニ', rom:'ni', en:'Sound: "ni"'},
  {cat:'Katakana', jp:'ヌ', rom:'nu', en:'Sound: "nu"'},
  {cat:'Katakana', jp:'ネ', rom:'ne', en:'Sound: "ne"'},
  {cat:'Katakana', jp:'ノ', rom:'no', en:'Sound: "no"'},
  {cat:'Katakana', jp:'ハ', rom:'ha', en:'Sound: "ha"'},
  {cat:'Katakana', jp:'ヒ', rom:'hi', en:'Sound: "hi"'},
  {cat:'Katakana', jp:'フ', rom:'fu', en:'Sound: "fu"'},
  {cat:'Katakana', jp:'ヘ', rom:'he', en:'Sound: "he"'},
  {cat:'Katakana', jp:'ホ', rom:'ho', en:'Sound: "ho"'},
  {cat:'Katakana', jp:'マ', rom:'ma', en:'Sound: "ma"'},
  {cat:'Katakana', jp:'ミ', rom:'mi', en:'Sound: "mi"'},
  {cat:'Katakana', jp:'ム', rom:'mu', en:'Sound: "mu"'},
  {cat:'Katakana', jp:'メ', rom:'me', en:'Sound: "me"'},
  {cat:'Katakana', jp:'モ', rom:'mo', en:'Sound: "mo"'},
  {cat:'Katakana', jp:'ヤ', rom:'ya', en:'Sound: "ya"'},
  {cat:'Katakana', jp:'ユ', rom:'yu', en:'Sound: "yu"'},
  {cat:'Katakana', jp:'ヨ', rom:'yo', en:'Sound: "yo"'},
  {cat:'Katakana', jp:'ラ', rom:'ra', en:'Sound: "ra"'},
  {cat:'Katakana', jp:'リ', rom:'ri', en:'Sound: "ri"'},
  {cat:'Katakana', jp:'ル', rom:'ru', en:'Sound: "ru"'},
  {cat:'Katakana', jp:'レ', rom:'re', en:'Sound: "re"'},
  {cat:'Katakana', jp:'ロ', rom:'ro', en:'Sound: "ro"'},
  {cat:'Katakana', jp:'ワ', rom:'wa', en:'Sound: "wa"'},
  {cat:'Katakana', jp:'ン', rom:'n', en:'Sound: "n"'},
  {cat:'Katakana Loanwords', jp:'テレビ', rom:'terebi', en:'TV'},
  {cat:'Katakana Loanwords', jp:'コーヒー', rom:'kohii', en:'Coffee'},
  {cat:'Katakana Loanwords', jp:'ホテル', rom:'hoteru', en:'Hotel'},
  {cat:'Katakana Loanwords', jp:'レストラン', rom:'resutoran', en:'Restaurant'},
  {cat:'Katakana Loanwords', jp:'スポーツ', rom:'supootsu', en:'Sports'},
  {cat:'Katakana Loanwords', jp:'ゲーム', rom:'geemu', en:'Game'},
  {cat:'Katakana Loanwords', jp:'メニュー', rom:'menyu', en:'Menu'},
  {cat:'Katakana Loanwords', jp:'コンビニ', rom:'konbini', en:'Convenience store'},
  {cat:'Katakana Loanwords', jp:'アイス', rom:'aisu', en:'Ice cream'},
  {cat:'Katakana Loanwords', jp:'バス', rom:'basu', en:'Bus'},
  {cat:'Katakana Loanwords', jp:'タクシー', rom:'takushii', en:'Taxi'},
  {cat:'Katakana Loanwords', jp:'スマホ', rom:'sumaho', en:'Smartphone'},
];

const CATS = ['All', ...Array.from(new Set(DATA.map(d=>d.cat)))];
let currentCat = 'All';
let deck = [...DATA];
let idx = 0;
let flipped = false;

const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('card');
const kanjiEl = document.getElementById('kanjiText');
const romajiEl = document.getElementById('romajiText');
const meaningEl = document.getElementById('meaningText');
const noteEl = document.getElementById('noteText');
const catTagFront = document.getElementById('catTagFront');
const catTagBack = document.getElementById('catTagBack');
const deckLabel = document.getElementById('deckLabel');
const stampsEl = document.getElementById('stamps');

function buildTabs(){
  tabsEl.innerHTML = '';
  CATS.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'tab' + (c===currentCat ? ' active' : '');
    b.textContent = c;
    b.onclick = () => { currentCat = c; applyFilter(); };
    tabsEl.appendChild(b);
  });
}

function applyFilter(){
  deck = currentCat === 'All' ? [...DATA] : DATA.filter(d=>d.cat===currentCat);
  idx = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  buildTabs();
  buildStamps();
  render();
}

function buildStamps(){
  stampsEl.innerHTML = '';
  deck.forEach((_,i)=>{
    const dot = document.createElement('div');
    dot.className = 'stamp-dot' + (i < idx ? ' done' : '');
    stampsEl.appendChild(dot);
  });
}

function render(){
  const item = deck[idx];
  kanjiEl.textContent = item.jp;
  romajiEl.textContent = item.rom;
  meaningEl.textContent = item.en;
  noteEl.textContent = item.note || '';
  catTagFront.textContent = item.cat;
  catTagBack.textContent = item.cat;
  deckLabel.textContent = `Card ${idx+1} of ${deck.length}`;
  buildStamps();
}

function flip(){
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
}

function next(){
  flipped = false;
  cardEl.classList.remove('flipped');
  idx = (idx+1) % deck.length;
  render();
}
function prev(){
  flipped = false;
  cardEl.classList.remove('flipped');
  idx = (idx-1+deck.length) % deck.length;
  render();
}
function shuffle(){
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]] = [deck[j],deck[i]];
  }
  idx = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
}
function restart(){
  idx = 0;
  flipped = false;
  cardEl.classList.remove('flipped');
  render();
}

cardEl.addEventListener('click', flip);
document.getElementById('flipBtn').addEventListener('click', (e)=>{ e.stopPropagation(); flip(); });
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('shuffleBtn').addEventListener('click', shuffle);
document.getElementById('restartBtn').addEventListener('click', restart);

document.getElementById('footerCount').textContent =
  `${DATA.length} characters · Hiragana, Katakana, and loanwords`;

buildTabs();
applyFilter();
</script>
</body>
</html>
